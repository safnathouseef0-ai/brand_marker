<style>
:root{--bg:#F5F6FA;--ink:#12143F;--mut:#555a78;--card:#fff;--line:#dcdff0;--blue:#2A35F5;--hl:#FFE94A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B0C24;--ink:#EEF0FF;--mut:#a4a8cc;--card:#151740;--line:#282b5c}}
:root[data-theme=dark]{--bg:#0B0C24;--ink:#EEF0FF;--mut:#a4a8cc;--card:#151740;--line:#282b5c}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.65 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque",Inter,system-ui,sans-serif;line-height:1.05;letter-spacing:-.025em;margin:0}
h2{font-size:clamp(2rem,5vw,3.4rem);font-weight:800}
h3{font-size:1.35rem;font-weight:600;letter-spacing:-.01em}
p{margin:0}a{color:inherit}
:focus-visible{outline:3px solid var(--hl);outline-offset:3px;box-shadow:0 0 0 5px var(--blue)}
.skip{position:absolute;left:-999px;top:8px;background:var(--hl);color:#12143F;padding:.6rem 1rem;z-index:99;font-weight:600}.skip:focus{left:8px}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
section{padding:80px 0}
.lead{color:var(--mut);max-width:58ch;margin-top:16px}
.btn{display:inline-block;background:var(--hl);color:#12143F;text-decoration:none;padding:.95rem 1.5rem;border-radius:999px;border:0;font:600 1rem Inter,sans-serif;cursor:pointer;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 0 -2px rgba(18,20,63,.25)}
.btn.ghost{background:transparent;color:inherit;border:2px solid currentColor}
header{position:sticky;top:0;z-index:50;background:var(--blue);color:#fff}
nav{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font:800 1.3rem "Bricolage Grotesque",sans-serif;text-decoration:none;display:flex;gap:.5rem;align-items:center}
.logo i{width:.9rem;height:1.4rem;background:var(--hl);transform:skewX(-12deg);display:block}
.links{display:none;gap:1.6rem;align-items:center}
.links a{text-decoration:none;font-weight:500;font-size:.95rem;background:linear-gradient(var(--hl),var(--hl)) 0 100%/0 3px no-repeat;padding-bottom:2px;transition:background-size .25s}
.links a:hover{background-size:100% 3px}
.links .btn{padding:.55rem 1.1rem;background-image:none;color:#12143F}
.menu{background:none;border:2px solid #fff;color:#fff;border-radius:8px;padding:.4rem .7rem;font:600 .9rem Inter}
.links.open{display:flex;position:absolute;left:0;right:0;top:100%;background:var(--blue);flex-direction:column;align-items:flex-start;padding:16px 20px 24px;gap:1rem}
@media(min-width:860px){.links{display:flex}.menu{display:none}}
.hero{background:var(--blue);color:#fff;padding:56px 0 96px;overflow:hidden}
.hero .wrap{display:grid;gap:48px}
.hero h1{font-size:clamp(3rem,10.5vw,7.2rem);font-weight:800;line-height:1.05;letter-spacing:-.025em;margin:0}
.hero p{font-size:1.2rem;max-width:44ch;margin:24px 0 32px;color:#dfe2ff}
.cta{display:flex;gap:14px;flex-wrap:wrap}
.chart{position:relative;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);border-radius:28px 6px 28px 6px;padding:18px}
.chart svg{width:100%;height:auto;display:block}
.g{stroke:rgba(255,255,255,.18);stroke-width:1}
.line{fill:none;stroke:var(--hl);stroke-width:12;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s .3s cubic-bezier(.6,0,.2,1) forwards}
.thin{fill:none;stroke:#fff;stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s .3s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.tag{position:absolute;background:#fff;color:#12143F;font-weight:600;font-size:.85rem;padding:.4rem .8rem;border-radius:8px}
.chart small{color:#dfe2ff;display:block;margin-top:8px}
@media(min-width:900px){.hero .wrap{grid-template-columns:1.25fr 1fr;align-items:end}}
.strip{background:var(--ink);color:var(--bg);padding:22px 0}
.strip .wrap{display:flex;flex-wrap:wrap;gap:12px 40px;justify-content:space-between;font-weight:500}
.strip b{font:800 1.6rem "Bricolage Grotesque",sans-serif;color:var(--hl);margin-right:8px}
.rows{margin-top:40px;border-top:2px solid var(--ink)}
.row{display:grid;gap:6px 32px;padding:22px 0;border-bottom:1px solid var(--line)}
.row h3{width:fit-content;background:linear-gradient(var(--hl),var(--hl)) 0 88%/0 .45em no-repeat;transition:background-size .3s}
.row:hover h3{background-size:100% .45em;color:#12143F}
.row p{color:var(--mut)}
@media(min-width:760px){.row{grid-template-columns:1fr 1.4fr}}
.cases{display:grid;gap:20px;margin-top:40px}
.case{padding:32px;border-radius:6px 32px 6px 32px;background:var(--ink);color:var(--bg)}
